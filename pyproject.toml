[project]
name = "xalling"
version = "0.1.0"
description = "Xalling desktop application built with pywebview"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywebview>=6.2.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
