[project]
name = "xalling"
version = "0.1.0"
description = "Xalling desktop application built with pywebview"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "anyio>=4.15.1",
    "asyncer>=0.0.18",
    "claude-agent-sdk>=0.2.152",
    "httpx",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "pywebview>=6.2.1",
    "tomli-w>=1.2.0",
    "yarl",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
